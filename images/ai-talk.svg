<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0926"/>
      <stop offset="50%" stop-color="#19154a"/>
      <stop offset="100%" stop-color="#341b59"/>
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#aiBg)"/>

  <!-- Neural Network Connections -->
  <g stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="80" y1="120" x2="160" y2="80"/>
    <line x1="80" y1="120" x2="160" y2="160"/>
    <line x1="80" y1="200" x2="160" y2="160"/>
    <line x1="80" y1="200" x2="160" y2="240"/>
    <line x1="80" y1="280" x2="160" y2="240"/>

    <line x1="160" y1="80" x2="250" y2="130"/>
    <line x1="160" y1="160" x2="250" y2="130"/>
    <line x1="160" y1="160" x2="250" y2="210"/>
    <line x1="160" y1="240" x2="250" y2="210"/>

    <line x1="250" y1="130" x2="350" y2="170"/>
    <line x1="250" y1="210" x2="350" y2="170"/>

    <line x1="350" y1="170" x2="440" y2="110"/>
    <line x1="350" y1="170" x2="440" y2="230"/>
  </g>

  <!-- Neural Network Glowing Nodes -->
  <g>
    <!-- Layer 1 -->
    <circle cx="80" cy="120" r="7" fill="#06b6d4" filter="url(#aiGlow)"/>
    <circle cx="80" cy="200" r="7" fill="#06b6d4" filter="url(#aiGlow)"/>
    <circle cx="80" cy="280" r="7" fill="#06b6d4" filter="url(#aiGlow)"/>

    <!-- Layer 2 -->
    <circle cx="160" cy="80" r="8" fill="#3b82f6"/>
    <circle cx="160" cy="160" r="9" fill="#8b5cf6"/>
    <circle cx="160" cy="240" r="8" fill="#3b82f6"/>

    <!-- Layer 3 (Center) -->
    <circle cx="250" cy="130" r="10" fill="#a855f7" filter="url(#aiGlow)"/>
    <circle cx="250" cy="210" r="10" fill="#a855f7" filter="url(#aiGlow)"/>

    <!-- Layer 4 (Nexus) -->
    <circle cx="350" cy="170" r="14" fill="#ec4899" filter="url(#aiGlow)"/>

    <!-- Layer 5 (Output) -->
    <circle cx="440" cy="110" r="8" fill="#f43f5e"/>
    <circle cx="440" cy="230" r="8" fill="#f43f5e"/>
  </g>

  <!-- Brain & AI Silhouette Graphics on Right -->
  <g transform="translate(420, 160)">
    <!-- Circuit rings -->
    <circle cx="50" cy="20" r="70" fill="none" stroke="url(#aiPurple)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
    <circle cx="50" cy="20" r="50" fill="none" stroke="url(#aiCyan)" stroke-width="2" opacity="0.4"/>
    
    <!-- Microchip Icon -->
    <rect x="25" y="-5" width="50" height="50" rx="8" fill="#1b1740" stroke="url(#aiCyan)" stroke-width="2.5"/>
    <rect x="35" y="5" width="30" height="30" rx="4" fill="url(#aiPurple)"/>
    <!-- Chip Pins -->
    <line x1="20" y1="5" x2="25" y2="5" stroke="#06b6d4" stroke-width="2"/>
    <line x1="20" y1="20" x2="25" y2="20" stroke="#06b6d4" stroke-width="2"/>
    <line x1="20" y1="35" x2="25" y2="35" stroke="#06b6d4" stroke-width="2"/>
    <line x1="75" y1="5" x2="80" y2="5" stroke="#06b6d4" stroke-width="2"/>
    <line x1="75" y1="20" x2="80" y2="20" stroke="#06b6d4" stroke-width="2"/>
    <line x1="75" y1="35" x2="80" y2="35" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Speaker Podium Silhouette -->
  <g transform="translate(80, 290)">
    <path d="M 15 20 L 35 20 L 40 70 L 10 70 Z" fill="#2d285c"/>
    <rect x="5" y="14" width="40" height="8" rx="2" fill="#4b3fe0"/>
    <line x1="25" y1="14" x2="28" y2="2" stroke="#ffb400" stroke-width="2"/>
    <circle cx="28" cy="2" r="2.5" fill="#ffb400"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 345)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#8f85ff"/>
    <text x="0" y="5" fill="#12102a" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="800" text-anchor="middle">🧠 INDUSTRY KEYNOTE &amp; CAREERS</text>
  </g>
</svg>
