<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stadiumSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="25%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="75%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sky and Atmosphere -->
  <rect width="600" height="230" fill="url(#stadiumSky)"/>

  <!-- Stadium Floodlights -->
  <g opacity="0.4">
    <polygon points="60,0 0,230 180,230 70,0" fill="#ffffff" opacity="0.2"/>
    <polygon points="540,0 420,230 600,230 530,0" fill="#ffffff" opacity="0.2"/>
    <!-- Light Towers -->
    <rect x="58" y="0" width="8" height="40" fill="#e2e8f0"/>
    <rect x="534" y="0" width="8" height="40" fill="#e2e8f0"/>
  </g>

  <!-- Pitch (Grass Field) -->
  <rect y="230" width="600" height="170" fill="url(#pitchGrad)"/>
  
  <!-- Field Lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-opacity="0.75" fill="none">
    <line x1="0" y1="230" x2="600" y2="230"/>
    <!-- Center circle perspective -->
    <ellipse cx="300" cy="330" rx="140" ry="45"/>
    <circle cx="300" cy="330" r="4" fill="#ffffff"/>
    <line x1="300" y1="230" x2="300" y2="400"/>
    <!-- Penalty Box -->
    <path d="M 120 400 L 160 270 L 440 270 L 480 400"/>
  </g>

  <!-- Action Motion Lines -->
  <g stroke="#ffb400" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="120" x2="160" y2="140"/>
    <line x1="60" y1="150" x2="170" y2="165"/>
    <line x1="90" y1="180" x2="180" y2="190"/>
  </g>

  <!-- Football (Soccer Ball) -->
  <g transform="translate(230, 150)" filter="url(#ballShadow)">
    <!-- Ball Base -->
    <circle cx="0" cy="0" r="65" fill="#f8fafc"/>
    <!-- Shading -->
    <path d="M 0 -65 A 65 65 0 0 1 65 0 A 65 65 0 0 1 0 65 A 65 65 0 0 0 0 -65" fill="#cbd5e1" opacity="0.5"/>
    <!-- Pentagons -->
    <!-- Center pentagon -->
    <polygon points="0,-15 16,-3 10,16 -10,16 -16,-3" fill="#1e293b"/>
    <!-- Seams connecting to outer patches -->
    <g stroke="#1e293b" stroke-width="3">
      <line x1="0" y1="-15" x2="0" y2="-40"/>
      <line x1="16" y1="-3" x2="38" y2="-12"/>
      <line x1="10" y1="16" x2="28" y2="35"/>
      <line x1="-10" y1="16" x2="-28" y2="35"/>
      <line x1="-16" y1="-3" x2="-38" y2="-12"/>
      <!-- Outer edge patches -->
      <polygon points="-12,-63 12,-63 0,-40" fill="#1e293b"/>
      <polygon points="56,-32 64,-10 38,-12" fill="#1e293b"/>
      <polygon points="45,46 28,35 48,22" fill="#1e293b"/>
      <polygon points="-45,46 -28,35 -48,22" fill="#1e293b"/>
      <polygon points="-56,-32 -64,-10 -38,-12" fill="#1e293b"/>
    </g>
  </g>

  <!-- Championship Trophy Silhouette / Badge on Right -->
  <g transform="translate(480, 130)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="48" fill="#ffe259" opacity="0.15"/>
    <!-- Trophy -->
    <path d="M -22 -30 L 22 -30 C 22 5 -22 5 -22 -30 Z" fill="url(#goldTrophy)"/>
    <path d="M -22 -24 C -36 -24 -36 -6 -22 -6" fill="none" stroke="url(#goldTrophy)" stroke-width="4"/>
    <path d="M 22 -24 C 36 -24 36 -6 22 -6" fill="none" stroke="url(#goldTrophy)" stroke-width="4"/>
    <!-- Stem & Base -->
    <rect x="-5" y="5" width="10" height="15" fill="url(#goldTrophy)"/>
    <path d="M -16 20 L 16 20 L 20 28 L -20 28 Z" fill="url(#goldTrophy)"/>
    <!-- Star on Trophy -->
    <polygon points="0,-16 3,-9 10,-9 5,-4 7,3 0,-1 -7,3 -5,-4 -10,-9 -3,-9" fill="#ffffff"/>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(300, 350)">
    <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#ffb400"/>
    <text x="0" y="5" fill="#1b1740" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="800" text-anchor="middle">⚽ 16 TEAMS • 1 TROPHY</text>
  </g>
</svg>
