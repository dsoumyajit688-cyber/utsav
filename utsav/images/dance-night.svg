<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="danceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20002c"/>
      <stop offset="50%" stop-color="#cbb4d4"/>
      <stop offset="100%" stop-color="#20002c"/>
    </linearGradient>
    <linearGradient id="laser1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="laser2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="festGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Club / Fest Stage Background -->
  <rect width="600" height="400" fill="#150a2a"/>

  <!-- Laser Beams / Light Cones -->
  <polygon points="100,0 0,380 180,380 160,0" fill="url(#laser1)" opacity="0.45"/>
  <polygon points="500,0 420,380 600,380 440,0" fill="url(#laser2)" opacity="0.45"/>
  <polygon points="300,0 200,380 400,380 300,0" fill="#ffb400" opacity="0.25"/>

  <!-- Disco Ball / Center Glow -->
  <circle cx="300" cy="50" r="26" fill="#f8fafc" filter="url(#festGlow)"/>
  <!-- Disco facets -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.7">
    <ellipse cx="300" cy="50" rx="26" ry="12" fill="none"/>
    <line x1="300" y1="24" x2="300" y2="76"/>
    <line x1="280" y1="28" x2="280" y2="72"/>
    <line x1="320" y1="28" x2="320" y2="72"/>
    <line x1="300" y1="0" x2="300" y2="24" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Sparkles & Confetti -->
  <g fill="#ffe259">
    <circle cx="90" cy="120" r="3"/>
    <circle cx="150" cy="80" r="4"/>
    <circle cx="240" cy="140" r="2"/>
    <circle cx="370" cy="100" r="3"/>
    <circle cx="480" cy="130" r="4"/>
    <circle cx="530" cy="90" r="2"/>
    <!-- Confetti rects -->
    <rect x="120" y="160" width="8" height="4" rx="1" fill="#ff007f" transform="rotate(25 120 160)"/>
    <rect x="420" y="140" width="8" height="4" rx="1" fill="#00f2fe" transform="rotate(-35 420 140)"/>
    <rect x="220" y="90" width="6" height="4" rx="1" fill="#ffb400" transform="rotate(45 220 90)"/>
  </g>

  <!-- Equalizer Waves in Background -->
  <g fill="#8b5cf6" opacity="0.35">
    <rect x="40" y="220" width="12" height="60" rx="4"/>
    <rect x="60" y="190" width="12" height="90" rx="4"/>
    <rect x="80" y="240" width="12" height="40" rx="4"/>
    <rect x="100" y="210" width="12" height="70" rx="4"/>
    <rect x="480" y="210" width="12" height="70" rx="4"/>
    <rect x="500" y="180" width="12" height="100" rx="4"/>
    <rect x="520" y="230" width="12" height="50" rx="4"/>
    <rect x="540" y="200" width="12" height="80" rx="4"/>
  </g>

  <!-- Dancing Crowd and Performers (Silhouettes) -->
  <g fill="#0b0617">
    <!-- Left Dancer (Arm Raised) -->
    <circle cx="210" cy="205" r="14"/>
    <path d="M 195 225 C 190 245, 192 280, 198 320 L 225 320 C 220 280, 222 245, 218 225 Z"/>
    <path d="M 196 230 L 165 190 L 175 180 L 202 225 Z"/>
    <path d="M 218 230 L 240 260 L 248 250 L 225 225 Z"/>
    <path d="M 198 320 L 185 380 L 202 380 L 210 330 L 220 380 L 238 380 L 225 320 Z"/>

    <!-- Center Lead Dancer (Dynamic Jump / Joy) -->
    <circle cx="300" cy="180" r="16"/>
    <!-- Headband / Glow -->
    <path d="M 284 205 C 280 230, 282 265, 290 300 L 315 300 C 318 265, 320 230, 314 205 Z"/>
    <!-- Both Arms in Air -->
    <path d="M 286 210 L 260 160 L 274 150 L 295 205 Z"/>
    <path d="M 314 210 L 340 160 L 326 150 L 305 205 Z"/>
    <!-- Legs -->
    <path d="M 290 300 L 270 380 L 290 380 L 302 315 L 315 380 L 335 380 L 315 300 Z"/>

    <!-- Right Dancer (Grooving) -->
    <circle cx="390" cy="210" r="14"/>
    <path d="M 378 230 C 375 250, 376 280, 380 320 L 406 320 C 408 280, 408 250, 400 230 Z"/>
    <path d="M 378 235 L 350 255 L 356 268 L 385 242 Z"/>
    <path d="M 400 235 L 430 195 L 440 205 L 408 245 Z"/>
    <path d="M 380 320 L 370 380 L 388 380 L 396 330 L 404 380 L 422 380 L 406 320 Z"/>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(300, 350)">
    <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#ff007f"/>
    <text x="0" y="5" fill="#ffffff" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="800" text-anchor="middle">🎉 LIVE DJ &amp; DANCE BATTLES</text>
  </g>
</svg>
